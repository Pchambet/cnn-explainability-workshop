[project]
name = "cnn-explainability-workshop"
version = "0.2.0"
description = "What an ImageNet VGG16 looks at in a face, and whether an eye bar stops it from re-identifying someone: measured on LFW."
readme = "README.md"
license = "MIT"
authors = [{ name = "Pierre Chambet", email = "pierrechambet@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pillow>=11.0",
    "scikit-learn>=1.6",
    "tensorflow>=2.20",
]

[project.scripts]
cnn-xai = "cnn_explainability.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]
notebook = ["ipykernel>=6.29", "nbconvert>=7.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnn_explainability"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
